name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: clipx, POSTGRES_PASSWORD: clipx, POSTGRES_DB: clipx_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clipx" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: System packages (ffmpeg, fonts, espeak for real-speech ASR tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-inter espeak-ng
      - name: Install
        run: uv venv .venv && uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check app tests
      - name: Type check
        run: .venv/bin/mypy app
      - name: Cache Whisper models
        uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: whisper-tiny-small-v1 }
      - name: Tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://clipx:clipx@127.0.0.1:5432/clipx_test
          TEST_REDIS_URL: redis://127.0.0.1:6379/15
          # Real-credential integration tests run only when these repository secrets exist.
          REAL_TWITCH_CLIENT_ID: ${{ secrets.REAL_TWITCH_CLIENT_ID }}
          REAL_TWITCH_CLIENT_SECRET: ${{ secrets.REAL_TWITCH_CLIENT_SECRET }}
        run: .venv/bin/pytest -q -rs

  web:
    name: Web (types, tests, builds)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
