name: Deploy to Cloudflare

# Every push to main that passes CI deploys the Worker (site + API + cron) to Cloudflare's free plan.
# Needs only repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (optional variables: CLIPX_DOMAIN,
# PUBLIC_APP_URL, TWITCH_TARGET_LOGIN). Worker secrets (CF_ACCESS_*, AUTHORIZED_EMAILS, SESSION_SECRET,
# TOKEN_ENCRYPTION_KEY, TWITCH_*, TIKTOK_*) live in Cloudflare and persist across deploys; until the Access secrets
# are set the site fails closed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    environment: production
    defaults:
      run:
        working-directory: apps/web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLIPX_DOMAIN: ${{ vars.CLIPX_DOMAIN }}
      PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
      TWITCH_TARGET_LOGIN: ${{ vars.TWITCH_TARGET_LOGIN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deploy credentials
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret $v is not set. See docs/DEPLOYMENT.md."; exit 1; fi
          done
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run build
      - name: Deploy
        # --force: secrets edited in the Cloudflare dashboard (Twitch/TikTok keys) are expected remote changes
        run: npx cf deploy --prebuilt --force
