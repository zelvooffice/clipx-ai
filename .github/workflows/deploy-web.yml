name: Deploy dashboard to Cloudflare Workers

# Every push to main that passes CI deploys the vinext build. Requires repository secrets
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and repository variables CLIPX_DOMAIN, API_ORIGIN,
# CF_ACCESS_TEAM_DOMAIN, CF_ACCESS_AUD, AUTHORIZED_EMAILS. Worker secrets (INTERNAL_API_SECRET,
# CF_ACCESS_CLIENT_ID/SECRET) are set once with `wrangler secret put` and persist across deploys.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    environment: production
    defaults:
      run:
        working-directory: apps/web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLIPX_DOMAIN: ${{ vars.CLIPX_DOMAIN }}
      API_ORIGIN: ${{ vars.API_ORIGIN }}
      CF_ACCESS_TEAM_DOMAIN: ${{ vars.CF_ACCESS_TEAM_DOMAIN }}
      CF_ACCESS_AUD: ${{ vars.CF_ACCESS_AUD }}
      AUTHORIZED_EMAILS: ${{ vars.AUTHORIZED_EMAILS }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to deploy without authentication configured
        run: |
          for v in CF_ACCESS_TEAM_DOMAIN CF_ACCESS_AUD AUTHORIZED_EMAILS API_ORIGIN CLIPX_DOMAIN; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set — the dashboard would fail closed (503). Run infra/cloudflare/setup-access.sh first."; exit 1; fi
          done
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run build:vinext
        env: { NEXT_TELEMETRY_DISABLED: "1" }
      - name: Deploy
        run: npx @vinext/cloudflare deploy
      - name: Verify unauthenticated access is blocked
        run: WEB_DOMAIN="$CLIPX_DOMAIN" API_DOMAIN="${API_ORIGIN#https://}" ../../infra/cloudflare/verify-access.sh
