name: Deploy to Cloudflare

# Every push to main that passes CI deploys the Worker (site + API + cron) to Cloudflare's free plan.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, and repository variables
# CF_ACCESS_TEAM_DOMAIN, CF_ACCESS_AUD, AUTHORIZED_EMAILS (optional: CLIPX_DOMAIN, PUBLIC_APP_URL, TWITCH_TARGET_LOGIN).
# Worker secrets (SESSION_SECRET, TOKEN_ENCRYPTION_KEY, TWITCH_*, TIKTOK_*) live in Cloudflare and persist across deploys.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    environment: production
    defaults:
      run:
        working-directory: apps/web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLIPX_DOMAIN: ${{ vars.CLIPX_DOMAIN }}
      PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
      TWITCH_TARGET_LOGIN: ${{ vars.TWITCH_TARGET_LOGIN }}
      CF_ACCESS_TEAM_DOMAIN: ${{ vars.CF_ACCESS_TEAM_DOMAIN }}
      CF_ACCESS_AUD: ${{ vars.CF_ACCESS_AUD }}
      AUTHORIZED_EMAILS: ${{ vars.AUTHORIZED_EMAILS }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to deploy without authentication configured
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CF_ACCESS_TEAM_DOMAIN CF_ACCESS_AUD AUTHORIZED_EMAILS; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set — the site would fail closed. See docs/DEPLOYMENT.md."; exit 1; fi
          done
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run build
      - name: Deploy
        run: npx cf deploy --prebuilt
