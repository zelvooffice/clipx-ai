[project]
name = "clipx-api"
version = "0.1.0"
description = "CLIPX AI backend: API, Twitch/TikTok integrations, highlight detection, video processing workers"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic[email]>=2.8",
  "pydantic-settings>=2.4",
  "redis>=5.0",
  "celery>=5.4",
  "httpx>=0.27",
  "websockets>=13",
  "cryptography>=43",
  "pyjwt[crypto]>=2.9",
  "boto3>=1.35",
  "numpy>=1.26",
  "opencv-python-headless>=4.10,<5",  # 5.x removed the bundled Haar cascades
  "faster-whisper>=1.0.3",
  "anthropic>=0.60",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6", "mypy>=1.11", "types-redis", "fakeredis>=2.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires real external credentials (skipped otherwise)", "media: requires ffmpeg"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008", "S603", "S607", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108", "E501"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
